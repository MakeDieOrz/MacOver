    - ${HomeDirectory}/Library/Containers/io.playcover.PlayCover/Sources.plist

whitelist:
    - ${HomeDirectory}/Library/Containers/${BundleID}

allow:
    - (allow user-preference-write (preference-domain ".GlobalPreferences"))
    - (allow user-preference-read (preference-domain ".GlobalPreferences"))
    - (allow file-read-metadata (literal "${HomeDirectory}/Library/Containers") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Applications") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Frameworks") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/App Settings") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/AppBackups") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/AppBackups/${BundleID}") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Entitlements") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Keymapping") (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/PlayChain") (literal "${HomeDirectory}/Library/Group Containers"))
    - (allow file-read* file-read-metadata file-ioctl file-map-executable (subpath "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Applications/${BundleID}.app"))
    - (allow file-read* file-read-metadata file-ioctl (literal "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Entitlements/${BundleID}.plist") (subpath "${HomeDirectory}/Library/Containers/app.makedie.MacOver/AppBackups/${BundleID}"))
    - (allow file* file-read* file-write* file-write-data file-read-metadata file-ioctl (subpath "${HomeDirectory}/Library/Containers/${BundleID}") (prefix "${HomeDirectory}/Library/Containers/app.makedie.MacOver/App Settings/${BundleID}.plist") (subpath "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Keymapping/${BundleID}") (prefix "${HomeDirectory}/Library/Containers/app.makedie.MacOver/PlayChain/${BundleID}.db"))
    - (allow file-read* file-read-metadata file-ioctl file-map-executable (subpath "${HomeDirectory}/Library/Containers/app.makedie.MacOver/Frameworks/PlayTools.framework"))

bypass:
    - (allow file-read* file-read-metadata file-ioctl (literal "/Library/Caches/com.apple.iconservices.store"))
    - '(allow file-read-data (regex #"^/private/var/db/mds/"))'
    - (allow file-ioctl file-read* file-read-data file-read-metadata (subpath "/private/var/db/mds/system/"))
    - '(allow file-read-metadata file-read* file-write* (regex #"^/private/var/db/mds/[0-9]+(/|$)"))'
    - (allow file-read-data (literal "${HomeDirectory}/Library/Preferences/com.apple.CloudKit.plist"))
