opt_in_rules:
  - force_unwrapping

excluded:
  - Carthage
  - Pods
  - .build
  - Packages/PlayCoverModules/.build
  - DerivedData
  - PlayTools
  - Config
  - Tests
  - PlayCoverMachOTests
  - PlayCoverCoreTests
  - plugins

disabled_rules:
  # see https://github.com/realm/SwiftLint/issues/5263
  - non_optional_string_data_conversion
  - identifier_name
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - inclusive_language
