name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Static Analysis, Tests & Runtime Harness (macos-26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect toolchain
        run: |
          xcodebuild -version
          xcrun clang --version

      - name: Run SwiftLint (strict)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

      - name: Run PlayCoverModules SwiftPM tests
        run: swift test --package-path Packages/PlayCoverModules

      - name: Run PlayTools Clang Static Analyzer & Format Check
        run: |
          chmod +x ci/run_static_analysis.sh
          ./ci/run_static_analysis.sh --check-format --derived-data "${RUNNER_TEMP}/dd-analyze"

      - name: Run PlayCoverTests suite
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCoverTests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/dd-tests" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build PlayCover Release & verify incremental no-op
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          PLAYTOOLS_BIN="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Frameworks/PlayTools.framework/Versions/A/PlayTools"
          python3 - "${PLAYTOOLS_BIN}" <<'PY'
          import re
          import subprocess
          import sys

          out = subprocess.check_output(["otool", "-l", sys.argv[1]], text=True)
          match = re.search(r"sectname __interpose\s+segname __DATA.*?\n\s+addr\s+0x[0-9a-fA-F]+\s+size\s+(0x[0-9a-fA-F]+)", out, re.S)
          if not match:
              sys.exit("Missing __DATA,__interpose section")
          size = int(match.group(1), 16)
          if size < 0x1100 or size % 16 != 0:
              sys.exit(f"Unexpected __interpose size: {hex(size)}")
          print(f"Verified __DATA,__interpose size={hex(size)} ({size // 16} entries)")
          PY

          PLAYCOVER_BIN="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/MacOS/MacOver"
          HELPER_BIN="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Library/HelperTools/PlayCoverHelper"
          HELPER_PLIST="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Library/LaunchDaemons/app.makedie.MacOver.Helper.plist"
          test -x "${HELPER_BIN}"
          plutil -lint "${HELPER_PLIST}"
          xcrun vtool -show-build "${PLAYCOVER_BIN}" | grep -q "minos 26.0"
          xcrun vtool -show-build "${HELPER_BIN}" | grep -q "minos 26.0"

          INCR_LOG=$(xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1)
          echo "${INCR_LOG}" | tail -n 15
          test "$(echo "${INCR_LOG}" | grep -c "PhaseScriptExecution" || true)" -eq 0
          test "$(echo "${INCR_LOG}" | grep -c "alwaysOutOfDate" || true)" -eq 0

      - name: Run headless runtime test harness
        run: |
          chmod +x Tests/RuntimeHarness/run_runtime_harness.py
          python3 Tests/RuntimeHarness/run_runtime_harness.py \
            --playtools-framework "${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Frameworks/PlayTools.framework" \
            --verbose
