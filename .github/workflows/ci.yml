name: CI

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-analysis:
    name: Lint, SwiftPM, Pure-C & Static Analysis
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect toolchain
        run: |
          xcodebuild -version
          xcrun clang --version

      - name: Run SwiftLint (strict)
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          TOOL_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          DYLD_FRAMEWORK_PATH="${TOOL_LIB}" swiftlint lint --strict
          (cd PlayTools && DYLD_FRAMEWORK_PATH="${TOOL_LIB}" swiftlint lint --strict)

      - name: Run pure-C unit tests (ASan/UBSan)
        run: ./ci/run_unit_tests_c.sh

      - name: Cache PlayCoverModules SwiftPM build
        uses: actions/cache@v5
        with:
          path: Packages/PlayCoverModules/.build
          key: spm-modules-xcode27-${{ hashFiles('Packages/PlayCoverModules/Package.swift', 'Packages/PlayCoverModules/Sources/**/*.swift', 'Packages/PlayCoverModules/Tests/**/*.swift') }}
          restore-keys: |
            spm-modules-xcode27-

      - name: Run PlayCoverModules SwiftPM tests
        run: swift test --package-path Packages/PlayCoverModules

      - name: Run PlayTools Clang Static Analyzer & Format Check
        run: |
          chmod +x ci/run_static_analysis.sh
          ./ci/run_static_analysis.sh --check-format --derived-data "${RUNNER_TEMP}/dd-analyze"

  xcode-tests:
    name: PlayCoverTests & PlayToolsTests
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Xcode SPM source packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/spm-packages
          key: xcode-spm-xcode27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            xcode-spm-xcode27-

      - name: Run PlayCoverTests suite
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCoverTests \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "${RUNNER_TEMP}/dd-tests" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm-packages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test

  release-and-harness:
    name: Release Build, Incremental Check & Runtime Harness
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Xcode SPM source packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/spm-packages
          key: xcode-spm-xcode27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            xcode-spm-xcode27-

      - name: Build PlayCover Release & verify incremental no-op
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm-packages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

          PLAYTOOLS_BIN="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Frameworks/PlayTools.framework/Versions/A/PlayTools"
          python3 - "${PLAYTOOLS_BIN}" <<'PY'
          import re
          import subprocess
          import sys

          out = subprocess.check_output(["otool", "-l", sys.argv[1]], text=True)
          match = re.search(r"sectname __interpose\s+segname (__DATA(?:_CONST)?)\s+addr\s+0x[0-9a-fA-F]+\s+size\s+(0x[0-9a-fA-F]+)", out)
          if not match:
              sys.exit("Missing __DATA/__DATA_CONST,__interpose section")
          segname = match.group(1)
          size = int(match.group(2), 16)
          if size < 0x1100 or size % 16 != 0:
              sys.exit(f"Unexpected __interpose size: {hex(size)}")
          print(f"Verified {segname},__interpose size={hex(size)} ({size // 16} entries)")
          PY

          APP_DIR="${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app"
          PLAYCOVER_BIN="${APP_DIR}/Contents/MacOS/MacOver"
          MCP_CLI_BIN="${APP_DIR}/Contents/MacOS/macover-mcp"
          COVER_BRIDGE_BIN="${APP_DIR}/Contents/Resources/BuiltInPlugins/CoverUseBridge/CoverUseBridge.dylib"
          COVER_BRIDGE_MANIFEST="${APP_DIR}/Contents/Resources/BuiltInPlugins/CoverUseBridge/PluginManifest.json"
          AGENT_PLUGIN_JSON="${APP_DIR}/Contents/Resources/AgentPlugin/macover-cover-use/plugin.json"
          AGENT_MCP_CONFIG="${APP_DIR}/Contents/Resources/AgentPlugin/macover-cover-use/mcp_config.json"
          HELPER_BIN="${APP_DIR}/Contents/Library/HelperTools/PlayCoverHelper"
          HELPER_PLIST="${APP_DIR}/Contents/Library/LaunchDaemons/app.makedie.MacOver.Helper.plist"
          AKINTERFACE_BIN="${APP_DIR}/Contents/Frameworks/PlayTools.framework/Versions/A/PlugIns/AKInterface.bundle/Contents/MacOS/AKInterface"
          test -x "${PLAYCOVER_BIN}"
          test -x "${MCP_CLI_BIN}"
          test -f "${COVER_BRIDGE_BIN}"
          test -f "${COVER_BRIDGE_MANIFEST}"
          test -f "${AGENT_PLUGIN_JSON}"
          test -f "${AGENT_MCP_CONFIG}"
          test -x "${HELPER_BIN}"
          test -x "${AKINTERFACE_BIN}"
          plutil -lint "${HELPER_PLIST}"
          python3 -m json.tool "${COVER_BRIDGE_MANIFEST}" >/dev/null
          python3 -m json.tool "${AGENT_PLUGIN_JSON}" >/dev/null
          python3 -m json.tool "${AGENT_MCP_CONFIG}" >/dev/null
          otool -s __TEXT __info_plist "${MCP_CLI_BIN}" | grep -F "Contents of (__TEXT,__info_plist)" >/dev/null
          xcrun vtool -show-build "${PLAYCOVER_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${MCP_CLI_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${COVER_BRIDGE_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${HELPER_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${PLAYTOOLS_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${AKINTERFACE_BIN}" | grep -F "minos 26.0" >/dev/null

          INCR_LOG=$(xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm-packages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1)
          echo "${INCR_LOG}" | tail -n 15
          test "$(echo "${INCR_LOG}" | grep -c "PhaseScriptExecution" || true)" -eq 0
          test "$(echo "${INCR_LOG}" | grep -c "alwaysOutOfDate" || true)" -eq 0

      - name: Run headless runtime test harness
        run: |
          chmod +x Tests/RuntimeHarness/run_runtime_harness.py
          python3 Tests/RuntimeHarness/run_runtime_harness.py \
            --playtools-framework "${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Frameworks/PlayTools.framework" \
            --cover-use-bridge "${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app/Contents/Resources/BuiltInPlugins/CoverUseBridge/CoverUseBridge.dylib" \
            --verbose
