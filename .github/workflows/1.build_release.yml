name: Build & Release macOS App
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: false
        type: string
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  CI: true

jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the version
        id: tag_version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [[ -z "${RAW_TAG}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${RAW_TAG}" ]]; then
            RAW_TAG="$(git describe --tags --always)"
          fi
          RAW_TAG="${RAW_TAG//\//-}"
          echo "TAG_NAME=${RAW_TAG}" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          bundle install
          command -v create-dmg >/dev/null || brew install create-dmg

      - name: Fastlane Release
        shell: bash
        run: bundle exec fastlane release
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

      - name: Extract API_KEY
        shell: bash
        run: |
          umask 077
          printf '%s' "$API_KEY" > apikey.json
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_JSON }}

      - name: Create DMG
        shell: bash
        run: |
          DMG_PATH="./output/PlayCover_${{ env.TAG_NAME }}.dmg"
          create-dmg \
            --volname "PlayCover ${{ env.TAG_NAME }}" \
            --skip-jenkins \
            "${DMG_PATH}" \
            "./output/PlayCover.app" || \
            hdiutil create -volname "PlayCover ${{ env.TAG_NAME }}" -srcfolder "./output/PlayCover.app" -ov -format UDZO "${DMG_PATH}"

      - name: Notarize DMG
        shell: bash
        run: bundle exec fastlane notarize_dmg "package:output/PlayCover_${{ env.TAG_NAME }}.dmg"

      - name: Clean Up
        if: always()
        shell: bash
        run: rm -f apikey.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_${{ env.TAG_NAME }}.dmg
          path: output/PlayCover_${{ env.TAG_NAME }}.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            output/PlayCover_${{ env.TAG_NAME }}.dmg
