name: Build & Release macOS App

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version tag
        id: tag_version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [[ -z "${RAW_TAG}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${RAW_TAG}" ]]; then
            RAW_TAG="$(git describe --tags --always)"
          fi
          RAW_TAG="${RAW_TAG//\//-}"
          echo "TAG_NAME=${RAW_TAG}" >> "$GITHUB_ENV"

      - name: Build MacOver (Release)
        shell: bash
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            clean build

      - name: Ad-hoc sign & verify MacOver.app
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/dmg-stage"
          APP="${STAGE_DIR}/MacOver.app"
          FW="${APP}/Contents/Frameworks"

          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          ditto "${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app" "${APP}"
          xattr -cr "${APP}"

          codesign --force --sign - "${FW}/PlayTools.framework/PlugIns/AKInterface.bundle"
          codesign --force --sign - "${FW}/PlayTools.framework"

          if [ -d "${FW}/Sparkle.framework" ]; then
            [ -e "${FW}/Sparkle.framework/Versions/B/Autoupdate" ] && codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/Autoupdate"
            [ -d "${FW}/Sparkle.framework/Versions/B/Updater.app" ] && codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/Updater.app"
            [ -d "${FW}/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" ] && codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
            [ -d "${FW}/Sparkle.framework/Versions/B/XPCServices/Installer.xpc" ] && codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
            codesign --force --sign - "${FW}/Sparkle.framework"
          fi

          if [ -f "${APP}/Contents/Library/HelperTools/PlayCoverHelper" ]; then
            codesign --force --sign - "${APP}/Contents/Library/HelperTools/PlayCoverHelper"
          fi

          codesign --force --sign - --entitlements PlayCover/PlayCoverRelease.entitlements "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      - name: Create & verify DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/dmg-stage"
          DMG_NAME="MacOver_${{ env.TAG_NAME }}.dmg"
          DMG_PATH="./output/${DMG_NAME}"

          ln -s /Applications "${STAGE_DIR}/Applications"
          mkdir -p ./output
          rm -f "${DMG_PATH}" "${DMG_PATH}.sha256"

          hdiutil create \
            -volname "MacOver ${{ env.TAG_NAME }}" \
            -srcfolder "${STAGE_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          hdiutil verify "${DMG_PATH}"

          (cd ./output && shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256")
          cat "${DMG_PATH}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOver_${{ env.TAG_NAME }}.dmg
          path: |
            output/MacOver_${{ env.TAG_NAME }}.dmg
            output/MacOver_${{ env.TAG_NAME }}.dmg.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            output/MacOver_${{ env.TAG_NAME }}.dmg
            output/MacOver_${{ env.TAG_NAME }}.dmg.sha256
