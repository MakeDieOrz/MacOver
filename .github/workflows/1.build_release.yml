name: Build & Release macOS App

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Xcode SPM source packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/spm-packages
          key: xcode-spm-xcode27-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            xcode-spm-xcode27-

      - name: Resolve version tag
        id: tag_version
        shell: bash
        run: |
          RAW_TAG="${{ inputs.tag_name }}"
          if [[ -z "${RAW_TAG}" && "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "${RAW_TAG}" ]]; then
            RAW_TAG="$(git describe --tags --always)"
          fi
          RAW_TAG="${RAW_TAG//\//-}"
          echo "TAG_NAME=${RAW_TAG}" >> "$GITHUB_ENV"

      - name: Build MacOver (Release)
        shell: bash
        run: |
          xcodebuild \
            -workspace PlayCover.xcworkspace \
            -scheme PlayCover \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/dd-release" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/spm-packages" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Ad-hoc sign & verify MacOver.app
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/dmg-stage"
          APP="${STAGE_DIR}/MacOver.app"
          FW="${APP}/Contents/Frameworks"

          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}"
          ditto "${RUNNER_TEMP}/dd-release/Build/Products/Release/MacOver.app" "${APP}"
          xattr -cr "${APP}"

          PLAYCOVER_BIN="${APP}/Contents/MacOS/MacOver"
          PLAYTOOLS_BIN="${FW}/PlayTools.framework/Versions/A/PlayTools"
          AKINTERFACE_BIN="${FW}/PlayTools.framework/Versions/A/PlugIns/AKInterface.bundle/Contents/MacOS/AKInterface"
          HELPER_BIN="${APP}/Contents/Library/HelperTools/PlayCoverHelper"
          HELPER_PLIST="${APP}/Contents/Library/LaunchDaemons/app.makedie.MacOver.Helper.plist"
          MCP_CLI_BIN="${APP}/Contents/MacOS/macover-mcp"
          COVER_BRIDGE_BIN="${APP}/Contents/Resources/BuiltInPlugins/CoverUseBridge/CoverUseBridge.dylib"
          COVER_BRIDGE_MANIFEST="${APP}/Contents/Resources/BuiltInPlugins/CoverUseBridge/PluginManifest.json"
          AGENT_PLUGIN_JSON="${APP}/Contents/Resources/AgentPlugin/macover-cover-use/plugin.json"
          AGENT_MCP_CONFIG="${APP}/Contents/Resources/AgentPlugin/macover-cover-use/mcp_config.json"

          test -x "${PLAYCOVER_BIN}"
          test -f "${PLAYTOOLS_BIN}"
          test -x "${AKINTERFACE_BIN}"
          test -x "${HELPER_BIN}"
          test -x "${MCP_CLI_BIN}"
          test -f "${COVER_BRIDGE_BIN}"
          test -f "${COVER_BRIDGE_MANIFEST}"
          test -f "${AGENT_PLUGIN_JSON}"
          test -f "${AGENT_MCP_CONFIG}"
          plutil -lint "${HELPER_PLIST}"
          python3 -m json.tool "${COVER_BRIDGE_MANIFEST}" >/dev/null
          python3 -m json.tool "${AGENT_PLUGIN_JSON}" >/dev/null
          python3 -m json.tool "${AGENT_MCP_CONFIG}" >/dev/null
          otool -s __TEXT __info_plist "${MCP_CLI_BIN}" | grep -F "Contents of (__TEXT,__info_plist)" >/dev/null
          xcrun vtool -show-build "${PLAYCOVER_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${MCP_CLI_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${COVER_BRIDGE_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${HELPER_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${PLAYTOOLS_BIN}" | grep -F "minos 26.0" >/dev/null
          xcrun vtool -show-build "${AKINTERFACE_BIN}" | grep -F "minos 26.0" >/dev/null

          codesign --force --sign - "${FW}/PlayTools.framework/PlugIns/AKInterface.bundle"
          codesign --force --sign - "${FW}/PlayTools.framework"

          if [ -d "${FW}/Sparkle.framework" ]; then
            if [ -e "${FW}/Sparkle.framework/Versions/B/Autoupdate" ]; then
              codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/Autoupdate"
            fi
            if [ -d "${FW}/Sparkle.framework/Versions/B/Updater.app" ]; then
              codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/Updater.app"
            fi
            if [ -d "${FW}/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" ]; then
              codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc"
            fi
            if [ -d "${FW}/Sparkle.framework/Versions/B/XPCServices/Installer.xpc" ]; then
              codesign --force --sign - "${FW}/Sparkle.framework/Versions/B/XPCServices/Installer.xpc"
            fi
            codesign --force --sign - "${FW}/Sparkle.framework"
          fi

          codesign --force --sign - "${HELPER_BIN}"
          codesign --force --sign - "${MCP_CLI_BIN}"
          codesign --force --sign - "${COVER_BRIDGE_BIN}"
          codesign -dv "${MCP_CLI_BIN}" 2>&1 | grep -F "Identifier=app.makedie.MacOver.MCP" >/dev/null

          codesign --force --sign - --entitlements PlayCover/PlayCoverRelease.entitlements "${APP}"
          codesign --verify --deep --strict --verbose=2 "${APP}"

      - name: Create & verify DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="${RUNNER_TEMP}/dmg-stage"
          DMG_NAME="MacOver_${{ env.TAG_NAME }}.dmg"
          DMG_PATH="./output/${DMG_NAME}"

          ln -s /Applications "${STAGE_DIR}/Applications"
          mkdir -p ./output
          rm -f "${DMG_PATH}" "${DMG_PATH}.sha256"

          hdiutil create \
            -volname "MacOver ${{ env.TAG_NAME }}" \
            -srcfolder "${STAGE_DIR}" \
            -ov \
            -format UDZO \
            "${DMG_PATH}"
          hdiutil verify "${DMG_PATH}"

          (cd ./output && shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256")
          cat "${DMG_PATH}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacOver_${{ env.TAG_NAME }}.dmg
          path: |
            output/MacOver_${{ env.TAG_NAME }}.dmg
            output/MacOver_${{ env.TAG_NAME }}.dmg.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            output/MacOver_${{ env.TAG_NAME }}.dmg
            output/MacOver_${{ env.TAG_NAME }}.dmg.sha256
