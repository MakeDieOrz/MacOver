name: Build nightly release
on:
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read

env:
  CI: true

jobs:
  build:
    runs-on: macos-latest
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          bundle install
          command -v create-dmg >/dev/null || brew install create-dmg

      - name: Set build number
        shell: bash
        run: |
          sed -i '' "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${{ github.run_number }}/" Config/Base.xcconfig

      - name: Fastlane Nightly
        shell: bash
        run: bundle exec fastlane nightly
        env:
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

      - name: Extract API_KEY
        shell: bash
        run: |
          umask 077
          printf '%s' "$API_KEY" > apikey.json
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_JSON }}

      - name: Create DMG
        shell: bash
        run: |
          DMG_PATH="./output/PlayCover_nightly_${{ github.run_number }}.dmg"
          create-dmg \
            --volname "PlayCover Nightly ${{ github.run_number }}" \
            --skip-jenkins \
            "${DMG_PATH}" \
            "./output/PlayCover.app" || \
            hdiutil create -volname "PlayCover Nightly ${{ github.run_number }}" -srcfolder "./output/PlayCover.app" -ov -format UDZO "${DMG_PATH}"

      - name: Notarize DMG
        shell: bash
        run: bundle exec fastlane notarize_dmg "package:output/PlayCover_nightly_${{ github.run_number }}.dmg"

      - name: Clean Up
        if: always()
        shell: bash
        run: rm -f apikey.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: output/PlayCover_nightly_${{ github.run_number }}.dmg
